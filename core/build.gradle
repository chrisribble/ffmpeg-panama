import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

description = 'Core FFmpeg Panama abstractions: contexts, frames, packets and resource scopes'

apply from: "${rootDir}/publish.gradle"

mavenPublishing {
	configure(new JavaLibrary(new JavadocJar.Empty(), new SourcesJar.Sources()))
}

dependencies {
	implementation project(':bindings')
	implementation libs.slf4j.api

	testImplementation libs.testng
	testRuntimeOnly libs.slf4j.simple
}

// Suppress "module not found" compilation warnings
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:-module']
}

tasks.named('test') {
	useTestNG()
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}
	jvmArgs(['--enable-native-access=ALL-UNNAMED'])
	systemProperty 'java.library.path', '/usr/lib64:/usr/lib:/usr/local/lib'

	// Allow loading local/homebrew FFmpeg libs on OSX
	environment 'DYLD_LIBRARY_PATH', '/usr/local/lib:/opt/homebrew/lib'
}

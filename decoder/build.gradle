import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

description = 'Video frame decoding built on the FFmpeg Panama bindings'

apply from: "${rootDir}/publish.gradle"

mavenPublishing {
	configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
}

dependencies {
	api project(':core')

	implementation project(':bindings')
	implementation libs.slf4j.api

	testImplementation libs.testng
	testRuntimeOnly libs.slf4j.simple
}

tasks.named('test') {
	useTestNG()
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}
	jvmArgs(['--enable-native-access=ALL-UNNAMED'])
	systemProperty 'java.library.path', '/usr/lib64:/usr/lib:/usr/local/lib'

	// Allow loading local/homebrew FFmpeg libs on OSX
	environment 'DYLD_LIBRARY_PATH', '/usr/local/lib:/opt/homebrew/lib'
}
